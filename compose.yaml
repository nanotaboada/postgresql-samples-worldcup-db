name: worldcup2022

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldcup}
      POSTGRES_USER: ${POSTGRES_USER:-worldcup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldcup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The postgres entrypoint only processes files at the top of
      # /docker-entrypoint-initdb.d/ (subdirectories are ignored).
      # `sql/init.sh` iterates schema/ and seed/ in alphabetical order.
      - ./sql:/repo/sql:ro
      - ./sql/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
